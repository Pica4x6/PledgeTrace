name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --python ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} ruff check src tests
      - run: uv run --python ${{ matrix.python-version }} python -m unittest discover -s tests -v
      - run: uv run --python ${{ matrix.python-version }} pledgetrace --help
      - run: uv build
