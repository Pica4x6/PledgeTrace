[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pledgetrace"
version = "1.0.0"
description = "Traceable extraction of policy proposals from electoral manifestos in PDF"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Pablo Picazo-Sanchez" }, { name = "Lara Ortiz-Martin" }]
keywords = ["electoral manifestos", "policy proposals", "information extraction", "PDF", "language models"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Text Processing",
]
dependencies = ["pymupdf>=1.24,<2"]

[project.urls]
Repository = "https://github.com/Pica4x6/PledgeTrace"
Issues = "https://github.com/Pica4x6/PledgeTrace/issues"

[project.scripts]
pledgetrace = "pledgetrace.cli:main"

[dependency-groups]
dev = ["ruff>=0.17,<0.18"]

[tool.hatch.build.targets.wheel]
packages = ["src/pledgetrace"]

[tool.hatch.build.targets.sdist]
include = ["src/pledgetrace", "tests", "docs", "examples", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml", "uv.lock"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
